name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  desktop:
    name: desktop-${{ matrix.flavor }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: online
            os: ubuntu-latest
            target: linux
          - flavor: online
            os: windows-latest
            target: win
          - flavor: online
            os: macos-latest
            target: mac
          - flavor: local
            os: ubuntu-latest
            target: linux
          - flavor: local
            os: windows-latest
            target: win
          - flavor: local
            os: macos-latest
            target: mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
            server/package-lock.json

      - name: Build web (${{ matrix.flavor }})
        working-directory: web
        env:
          VITE_LOCAL_MODE: ${{ matrix.flavor == 'local' && '1' || '0' }}
        run: |
          npm ci
          npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install server deps (online)
        if: matrix.flavor == 'online'
        working-directory: server
        run: npm ci

      - name: Bundle server (online)
        if: matrix.flavor == 'online'
        working-directory: desktop
        run: npm run build:server

      - name: Skip server bundle (local)
        if: matrix.flavor == 'local'
        working-directory: desktop
        run: node -e "const f=require('node:fs');f.mkdirSync('server-dist',{recursive:true});f.writeFileSync('server-dist/.keep','')"

      - name: Package (online)
        if: matrix.flavor == 'online'
        working-directory: desktop
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Package (local)
        if: matrix.flavor == 'local'
        working-directory: desktop
        run: npx electron-builder --${{ matrix.target }} --publish never --config.artifactName='CloudMusic-Local-${version}.${ext}'

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.flavor }}-${{ matrix.target }}
          path: desktop/release/*
          if-no-files-found: error

  android:
    name: android-${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [online, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build web (${{ matrix.flavor }})
        working-directory: web
        env:
          VITE_LOCAL_MODE: ${{ matrix.flavor == 'local' && '1' || '0' }}
        run: |
          npm ci
          npm run build

      - name: Capacitor sync
        working-directory: web
        run: npx cap sync android

      - name: Prepare signing key
        working-directory: web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ci-release.jks
            echo "XIAOYUN_KEYSTORE_PATH=$PWD/ci-release.jks" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore ci-debug.jks -storepass xiaoyun123456 \
              -keypass xiaoyun123456 -alias xiaoyun -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CloudMusic, O=Xiaoyun House, C=CN"
            echo "XIAOYUN_KEYSTORE_PATH=$PWD/ci-debug.jks" >> "$GITHUB_ENV"
          fi
          echo "XIAOYUN_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'xiaoyun123456' }}" >> "$GITHUB_ENV"
          echo "XIAOYUN_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'xiaoyun' }}" >> "$GITHUB_ENV"
          echo "XIAOYUN_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'xiaoyun123456' }}" >> "$GITHUB_ENV"

      - name: Assemble release
        working-directory: web/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        working-directory: web/android
        run: |
          mkdir -p ../../out
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.flavor }}" = "local" ]; then
            target="CloudMusic-Local-${version}.apk"
          else
            target="CloudMusic-${version}.apk"
          fi
          cp app/build/outputs/apk/release/app-release*.apk "../../out/${target}" 2>/dev/null \
            || cp app/build/outputs/apk/release/app-release*.apk "../../out/CloudMusic-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}
          path: out/*.apk
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.AppImage" -o -name "*.exe" -o -name "*.dmg" -o -name "*.apk" \) -exec cp {} dist/ \;
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
