name: deploy-server

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 对外域名
        required: false
        default: music.lichenlc.cn
      port:
        description: 服务端本地端口
        required: false
        default: "3001"
      app_dir:
        description: 服务器上的部署目录
        required: false
        default: /opt/cloudmusic
      skip_certbot:
        description: 跳过证书签发（填 true 可跳过）
        required: false
        default: "false"
  push:
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST || secrets.SSH_HOST || secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || secrets.SERVER_USER || secrets.SSH_USER || secrets.DEPLOY_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HOST}" ] || missing="$missing VPS_HOST"
          [ -n "${USER_NAME}" ] || missing="$missing VPS_USER"
          [ -n "${KEY}" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets:$missing"
            echo "请在 Settings → Secrets and variables → Actions 里添加："
            echo "  VPS_HOST     服务器地址（IP 或域名）"
            echo "  VPS_USER     登录用户，需能 sudo（如 root / ubuntu）"
            echo "  VPS_SSH_KEY  该用户对应的私钥全文（-----BEGIN ... PRIVATE KEY-----）"
            echo "  VPS_PORT     可选，默认 22"
            exit 1
          fi
          echo "凭据齐备，目标用户 ${USER_NAME}"

      - name: Prepare ssh
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST || secrets.SSH_HOST || secrets.DEPLOY_HOST }}
          PORT_SSH: ${{ secrets.VPS_PORT || '22' }}
          USER_NAME: ${{ secrets.VPS_USER || secrets.SERVER_USER || secrets.SSH_USER || secrets.DEPLOY_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT_SSH" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $HOST
            Port $PORT_SSH
            User $USER_NAME
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          ssh -o BatchMode=yes target 'echo ssh-ok && uname -a'

      - name: Write remote script
        run: |
          cat > remote-setup.sh <<'REMOTE'
          set -euo pipefail

          DOMAIN="${DOMAIN:?domain required}"
          PORT="${PORT:-3001}"
          APPDIR="${APPDIR:-/opt/cloudmusic}"
          REPO="https://github.com/SouthNight06/BlueBerryCloud.git"
          SKIP_CERTBOT="${SKIP_CERTBOT:-false}"
          WANT_SHA="${WANT_SHA:-}"

          log() { printf '\n==> %s\n' "$*"; }
          export DEBIAN_FRONTEND=noninteractive

          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo -n"; fi

          log "1/8 安装基础软件"
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq git curl openssl ca-certificates

          log "2/8 检查 Node 版本（需要 >= 22.5）"
          NODE_OK=0
          if command -v node >/dev/null 2>&1; then
            if node -e 'const [a,b]=process.versions.node.split(".").map(Number);process.exit(a>22||(a===22&&b>=5)?0:1)'; then NODE_OK=1; fi
          fi
          if [ "$NODE_OK" != "1" ]; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | $SUDO bash - >/dev/null
            $SUDO apt-get install -y -qq nodejs
          fi
          node -v

          log "3/8 同步代码"
          sync_git() {
            if [ -d "$APPDIR/.git" ]; then
              $SUDO git -C "$APPDIR" remote set-url origin "$REPO" || return 1
              timeout 45 $SUDO git -C "$APPDIR" -c http.version=HTTP/1.1 fetch --depth=1 origin main || return 1
              $SUDO git -C "$APPDIR" reset --hard FETCH_HEAD || return 1
            else
              timeout 45 $SUDO git -c http.version=HTTP/1.1 clone --depth=1 "$REPO" "$APPDIR" || return 1
            fi
            return 0
          }
          sync_tar() {
            TMPD="$(mktemp -d)"
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 300 \
              "https://codeload.github.com/SouthNight06/BlueBerryCloud/tar.gz/refs/heads/main" -o "$TMPD/src.tar.gz"
            tar -xzf "$TMPD/src.tar.gz" -C "$TMPD"
            $SUDO mkdir -p "$APPDIR"
            if command -v rsync >/dev/null 2>&1; then
              $SUDO rsync -a --delete --exclude .git "$TMPD"/BlueBerryCloud-main/ "$APPDIR"/
            else
              $SUDO cp -a "$TMPD"/BlueBerryCloud-main/. "$APPDIR"/
            fi
            rm -rf "$TMPD"
          }
          SYNC_OK=0
          SYNC_HEAD=""
          for i in 1 2; do
            if sync_git; then
              SYNC_HEAD="$($SUDO git -C "$APPDIR" rev-parse HEAD 2>/dev/null || true)"
              if [ -z "$WANT_SHA" ] || [ "$SYNC_HEAD" = "$WANT_SHA" ]; then SYNC_OK=1; break; fi
              echo "  同步到 ${SYNC_HEAD:0:7}，期望 ${WANT_SHA:0:7}"
            fi
            echo "  git 同步失败（第 $i 次），5 秒后重试"
            sleep 5
          done
          if [ "$SYNC_OK" != "1" ]; then
            echo "  git 直连持续失败，回退到 codeload tarball"
            sync_tar
            SYNC_HEAD="tar(${WANT_SHA:0:7})"
          fi
          echo "  代码版本：$SYNC_HEAD"

          log "4/8 安装服务端依赖"
          cd "$APPDIR/server"
          $SUDO npm ci --omit=dev --no-audit --no-fund

          log "5/8 生成环境变量与数据目录"
          $SUDO install -d -m 750 /var/lib/cloudmusic
          $SUDO install -d -m 700 /etc/cloudmusic
          SECRET=""
          if [ -s /etc/cloudmusic/env ]; then
            SECRET="$(sed -n 's/^JWT_SECRET=//p' /etc/cloudmusic/env | head -1)"
          fi
          if [ -z "$SECRET" ]; then SECRET="$(openssl rand -hex 32)"; fi
          $SUDO tee /etc/cloudmusic/env >/dev/null <<ENVFILE
          JWT_SECRET=$SECRET
          NODE_ENV=production
          HOST=127.0.0.1
          PORT=$PORT
          XIAOYUN_DATA_DIR=/var/lib/cloudmusic
          CORS_ORIGINS=*
          MAX_UPLOAD_BYTES=209715200
          ENVFILE
          $SUDO chmod 600 /etc/cloudmusic/env

          log "6/8 写入 systemd 并启动"
          NODE_BIN="$(command -v node)"
          $SUDO tee /etc/systemd/system/cloudmusic.service >/dev/null <<UNIT
          [Unit]
          Description=CloudMusic server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=$APPDIR/server
          EnvironmentFile=/etc/cloudmusic/env
          Environment=NODE_ENV=production
          Environment=HOST=127.0.0.1
          Environment=PORT=$PORT
          ExecStart=$NODE_BIN src/index.js
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT
          $SUDO systemctl daemon-reload
          $SUDO systemctl enable cloudmusic >/dev/null 2>&1 || true
          $SUDO systemctl restart cloudmusic
          sleep 3
          $SUDO systemctl is-active cloudmusic
          curl -fsS "http://127.0.0.1:$PORT/api/health"
          echo

          log "7/8 配置 nginx 反向代理"
          NGINX_BIN="/www/server/nginx/sbin/nginx"
          if [ ! -x "$NGINX_BIN" ]; then NGINX_BIN="$(command -v nginx || true)"; fi
          if [ -z "$NGINX_BIN" ]; then
            echo "::error::没有找到 nginx：请在宝塔面板新建站点，或先安装 nginx"
            exit 3
          fi
          if [ -d /www/server/panel/vhost/nginx ]; then
            VHOST_DIR=/www/server/panel/vhost/nginx
            WEBROOT=/www/wwwroot/$DOMAIN
            CERT_DIR=/www/server/nginx/conf
            NGINX_OWNER=bt
          else
            VHOST_DIR=/etc/nginx/conf.d
            WEBROOT=/var/www/$DOMAIN
            CERT_DIR=/etc/letsencrypt/live/$DOMAIN
            NGINX_OWNER=plain
          fi
          echo "nginx 模式：$NGINX_OWNER（$NGINX_BIN，vhost $VHOST_DIR）"
          $SUDO mkdir -p "$WEBROOT/.well-known/acme-challenge"

          CONF="$VHOST_DIR/$DOMAIN.conf"
          if [ -f "$CONF" ]; then
            echo "已存在 $CONF，保留现有站点配置"
          else
            $SUDO install -d -m 700 "$CERT_DIR"
            TMPCONF=/tmp/cloudmusic-$DOMAIN.conf
            cat > "$TMPCONF" <<WEBCFG
          server {
              listen 80;
              server_name $DOMAIN;

              client_max_body_size 200m;

              location ^~ /.well-known/acme-challenge/ {
                  root $WEBROOT;
                  default_type "text/plain";
              }

              location / {
                  proxy_pass http://127.0.0.1:$PORT;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }
          WEBCFG
            $SUDO tee "$CONF" < "$TMPCONF" >/dev/null
            CREATED=1
          fi

          $SUDO "$NGINX_BIN" -t
          $SUDO systemctl reload nginx || $SUDO "$NGINX_BIN" -s reload
          sleep 1
          HTTPS_BODY="$(curl -k -sS -m 15 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/api/health" 2>/dev/null || true)"
          HTTP_INFO="$(curl -sS -m 15 -H "Host: $DOMAIN" -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1/api/health" 2>/dev/null || true)"
          echo "本机 https：${HTTPS_BODY:0:120}"
          echo "本机 http ：$HTTP_INFO"
          if printf '%s' "$HTTPS_BODY" | grep -q cloudmusic; then
            echo "  自测通过：https 直连命中本服务"
          elif printf '%s' "$HTTP_INFO" | grep -q "$DOMAIN"; then
            echo "  自测通过：http 已跳转到 https"
          else
            echo "::error::nginx 没有把 $DOMAIN 指向本服务（可能被面板或默认站点截走）"
            if [ "${CREATED:-0}" = "1" ]; then
              $SUDO rm -f "$CONF"
              $SUDO "$NGINX_BIN" -t && ($SUDO systemctl reload nginx || $SUDO "$NGINX_BIN" -s reload) || true
              echo "已回滚新写入的 $CONF"
            fi
            exit 4
          fi

          log "8/8 申请 HTTPS 证书"
          CRT=""
          KEY=""
          if [ -f "$CERT_DIR/$DOMAIN.crt" ]; then
            CRT="$CERT_DIR/$DOMAIN.crt"
            KEY="$CERT_DIR/$DOMAIN.key"
          fi
          if [ -z "$CRT" ] && [ "$SKIP_CERTBOT" != "true" ]; then
            if [ -x /root/.acme.sh/acme.sh ]; then
              /root/.acme.sh/acme.sh --issue -d "$DOMAIN" --webroot "$WEBROOT" --keylength ec-256 \
                || echo "::warning::acme.sh 签发失败，请检查 80 端口是否放行"
              /root/.acme.sh/acme.sh --install-cert -d "$DOMAIN" --ecc \
                --key-file "$CERT_DIR/$DOMAIN.key" \
                --fullchain-file "$CERT_DIR/$DOMAIN.crt" \
                --reloadcmd "systemctl reload nginx" || true
            elif command -v certbot >/dev/null 2>&1; then
              $SUDO certbot certonly --webroot -w "$WEBROOT" -d "$DOMAIN" -n --agree-tos \
                -m "admin@$DOMAIN" --keep-until-expiring \
                || $SUDO certbot certonly --webroot -w "$WEBROOT" -d "$DOMAIN" -n --agree-tos \
                --register-unsafely-without-email --keep-until-expiring \
                || echo "::warning::certbot 签发失败"
            else
              echo "::warning::没有 acme.sh / certbot，跳过证书申请，先保留 http"
            fi
            if [ -f "$CERT_DIR/$DOMAIN.crt" ]; then
              CRT="$CERT_DIR/$DOMAIN.crt"
              KEY="$CERT_DIR/$DOMAIN.key"
            elif [ -f "$CERT_DIR/fullchain.pem" ]; then
              CRT="$CERT_DIR/fullchain.pem"
              KEY="$CERT_DIR/privkey.pem"
            fi
          fi

          if [ -n "$CRT" ] && ! grep -q "listen 443" "$CONF"; then
            cat > /tmp/cloudmusic-$DOMAIN-ssl.conf <<SSLCFG
          server {
              listen 443 ssl;
              server_name $DOMAIN;

              ssl_certificate $CRT;
              ssl_certificate_key $KEY;
              ssl_protocols TLSv1.2 TLSv1.3;

              client_max_body_size 200m;

              location / {
                  proxy_pass http://127.0.0.1:$PORT;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }
          SSLCFG
            $SUDO tee -a "$CONF" < /tmp/cloudmusic-$DOMAIN-ssl.conf >/dev/null
            echo "已追加 443 server 块：$CRT"
          fi

          $SUDO "$NGINX_BIN" -t
          $SUDO systemctl reload nginx || $SUDO "$NGINX_BIN" -s reload
          sleep 1

          log "验收"
          curl -fsS "https://$DOMAIN/api/health" || curl -fsS "http://$DOMAIN/api/health"
          echo
          REMOTE
          echo "远程脚本已生成"

      - name: Upload and run
        env:
          DOMAIN: ${{ inputs.domain || 'music.lichenlc.cn' }}
          PORT: ${{ inputs.port || '3001' }}
          APPDIR: ${{ inputs.app_dir || '/opt/cloudmusic' }}
          SKIP_CERTBOT: ${{ inputs.skip_certbot || 'false' }}
        run: |
          set -euo pipefail
          scp -q remote-setup.sh target:/tmp/cloudmusic-setup.sh
          ssh -tt target "DOMAIN='$DOMAIN' PORT='$PORT' APPDIR='$APPDIR' SKIP_CERTBOT='$SKIP_CERTBOT' WANT_SHA='$GITHUB_SHA' bash /tmp/cloudmusic-setup.sh"

      - name: Verify from runner
        env:
          DOMAIN: ${{ inputs.domain || 'music.lichenlc.cn' }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            BODY="$(curl -fsS --max-time 15 "https://$DOMAIN/api/health" || true)"
            echo "try $i: $BODY"
            case "$BODY" in
              *'"name":"cloudmusic"'*) echo "部署成功"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::https://$DOMAIN/api/health 未返回 cloudmusic"
          exit 1
